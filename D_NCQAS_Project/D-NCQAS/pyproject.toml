[build-system]
requires = ["setuptools==84.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "d-ncqas"
version = "3.0.0"
description = "Auditable noise-aware quantum architecture search with controlled synthetic-noise experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "pandas==2.2.3", "matplotlib==3.10.8", "tabulate==0.9.0"]

[project.optional-dependencies]
chemistry = ["pyscf==2.11.0", "h5py==3.16.0"]
notebook = ["nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.30.1"]

[tool.setuptools.packages.find]
where = ["src"]
